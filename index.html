<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pace Plot - Safe Run & Walk Navigation by Stride Circuit LLC</title>
  <meta name="description" content="Safe run and walk GPS navigation app featuring street-snapped safe loops, real-time GPS telemetry, turn-by-turn voice guidance, and Bluetooth heart rate zones.">
  <meta property="og:title" content="Pace Plot - Safe Run & Walk Navigation by Stride Circuit LLC">
  <meta property="og:description" content="Safe run and walk GPS navigation app featuring street-snapped safe loops, real-time GPS telemetry, turn-by-turn voice guidance, and Bluetooth heart rate zones.">

  <!-- Web App Manifest & Android PWA/TWA Configuration -->
  <link rel="manifest" href="/manifest.json" crossorigin="use-credentials">
  <link rel="icon" type="image/svg+xml" href="/icon.svg">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <meta name="theme-color" content="#0B0C0E">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Pace Plot">

  <!-- Google Fonts: Plus Jakarta Sans & JetBrains Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400;1,700&family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet">

  <script>
    // Apply saved theme preference from LocalStorage immediately to prevent FOUC
    (function () {
      try {
        var saved = localStorage.getItem('paceplot_theme');
        var theme = saved === 'light' ? 'light' : 'dark';
        document.documentElement.classList.toggle('dark', theme === 'dark');
        document.documentElement.classList.toggle('light', theme === 'light');
        document.documentElement.setAttribute('data-theme', theme);
        document.documentElement.style.colorScheme = theme;
      } catch (e) {
        document.documentElement.classList.add('dark');
      }
    })();
  </script>
</head>
<body class="bg-stone-200 dark:bg-stone-950 sm:bg-stone-200/90 sm:dark:bg-stone-900 text-stone-900 dark:text-stone-100 font-sans min-h-screen flex flex-col items-center justify-center p-0 sm:p-4 transition-colors duration-200">

  <!-- @include src/templates/header-nav.html -->

    <!-- Content Views (Tabs) -->
    <div class="flex-1 relative flex flex-col overflow-hidden">
      <!-- @include src/templates/tab-planner.html -->
      <!-- @include src/templates/tab-safeguard.html -->
      <!-- @include src/templates/tab-health.html -->
      <!-- @include src/templates/tab-events-saved.html -->
    </div>

    <!-- Android Bottom Navigation Bar (Material 3 style with 5 tabs) -->
    <nav class="w-full bg-white dark:bg-stone-900 border-t border-stone-200 dark:border-stone-800 px-2 py-1.5 flex items-center justify-between z-30">
      <button class="bottom-nav-btn active flex flex-col items-center gap-0.5 text-terracotta transition flex-1" data-target="tabPlanner">
        <div class="w-9 h-6 rounded-full bg-terracotta/15 flex items-center justify-center">
          <i class="fa-solid fa-map-location-dot text-xs"></i>
        </div>
        <span class="text-[9px] font-bold">Route Map</span>
      </button>

      <button class="bottom-nav-btn flex flex-col items-center gap-0.5 text-stone-500 hover:text-stone-800 dark:text-stone-400 dark:hover:text-stone-100 transition flex-1" data-target="tabSafetyBeacon">
        <div class="w-9 h-6 rounded-full flex items-center justify-center">
          <i class="fa-solid fa-shield-halved text-xs"></i>
        </div>
        <span class="text-[9px] font-bold">SafeGuard</span>
      </button>

      <button class="bottom-nav-btn flex flex-col items-center gap-0.5 text-stone-500 hover:text-stone-800 dark:text-stone-400 dark:hover:text-stone-100 transition flex-1" data-target="tabHealth">
        <div class="w-9 h-6 rounded-full flex items-center justify-center">
          <i class="fa-solid fa-heart-pulse text-xs"></i>
        </div>
        <span class="text-[9px] font-bold">Health & Watch</span>
      </button>

      <button class="bottom-nav-btn flex flex-col items-center gap-0.5 text-stone-500 hover:text-stone-800 dark:text-stone-400 dark:hover:text-stone-100 transition flex-1" data-target="tabEvents">
        <div class="w-9 h-6 rounded-full flex items-center justify-center">
          <i class="fa-solid fa-calendar-days text-xs"></i>
        </div>
        <span class="text-[9px] font-bold">Races</span>
      </button>

      <button class="bottom-nav-btn flex flex-col items-center gap-0.5 text-stone-500 hover:text-stone-800 dark:text-stone-400 dark:hover:text-stone-100 transition flex-1" data-target="tabSaved">
        <div class="w-9 h-6 rounded-full flex items-center justify-center">
          <i class="fa-solid fa-bookmark text-xs"></i>
        </div>
        <span class="text-[9px] font-bold">Library</span>
      </button>
    </nav>

    <!-- Android Gesture Pill / Home Bar -->
    <div class="w-full h-4 bg-white dark:bg-stone-900 flex items-center justify-center pb-1 z-30">
      <div class="w-32 h-1 bg-stone-300 dark:bg-stone-700 rounded-full"></div>
    </div>

    <!-- @include src/templates/modals.html -->
  </main>

  <!-- Desktop Footnote (Hidden on mobile/installed app) -->
  <footer class="mt-3 hidden sm:block text-center text-xs text-stone-600 dark:text-stone-400 max-w-md transition-colors duration-200">
    <p><strong class="text-stone-900 dark:text-stone-200">Pace Plot</strong> by Stride Circuit LLC · Live GPS Navigation, Street-Snapped Safe Loops & Bluetooth HR Telemetry.</p>
  </footer>

  <!-- Inline Service Worker Registration for Static PWA Scanners (PWABuilder / Bubblewrap) -->
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/sw.js', { scope: '/' }).catch(function () {});
    }
  </script>

  <!-- Application Module Script (Vite Bundled) -->
  <script type="module" src="/src/main.js"></script>
</body>
</html>
