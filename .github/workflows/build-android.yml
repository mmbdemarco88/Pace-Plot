name: Build Pace Plot Android App Bundle

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Install Dependencies & Setup Capacitor
        run: |
          npm install
          npm install @capacitor/core @capacitor/cli @capacitor/android
          
          # Create web directory for Capacitor
          mkdir -p www
          cp -r index.html * www/ 2>/dev/null || true
          
          # Configure Capacitor
          if [ ! -f "capacitor.config.json" ] && [ ! -f "capacitor.config.ts" ]; then
            cat << 'EOF' > capacitor.config.json
          {
            "appId": "com.stridecircuit.paceplot",
            "appName": "Pace Plot",
            "webDir": "www"
          }
          EOF
          fi
          
          # Add and sync Android platform
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          npx cap sync android

      - name: Build Android App Bundle (.aab)
        run: |
          cd android
          chmod +x gradlew
          ./gradlew bundleRelease

      - name: Sign App Bundle for Google Play
        run: |
          keytool -genkey -v -keystore release-key.jks -alias paceplot -keyalg RSA -keysize 2048 -validity 10000 -storepass StrideCircuit2026 -keypass StrideCircuit2026 -dname "CN=Stride Circuit, OU=Mobile, O=Stride Circuit LLC, L=Parma, ST=Ohio, C=US"
          AAB_FILE=$(find android/app/build/outputs/bundle/release -name "*.aab" | head -n 1)
          jarsigner -verbose -sigalg SHA256withRSA -digestalg SHA-256 -keystore release-key.jks -storepass StrideCircuit2026 -keypass StrideCircuit2026 "$AAB_FILE" paceplot
          cp "$AAB_FILE" paceplot-release-signed.aab

      - name: Upload Finished Bundle Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PacePlot-Release-AAB
          path: paceplot-release-signed.aab
