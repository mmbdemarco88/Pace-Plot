name: Build Pace Plot Native Android App

on:
  push:
    branches: [ '**' ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Initialize Package and Capacitor (Self-Healing)
        run: |
          if [ ! -f "package.json" ]; then
            npm init -y
          fi
          
          npm install @capacitor/core @capacitor/cli @capacitor/android
          
          mkdir -p www
          cp -r index.html * www/ 2>/dev/null || true
          
          cat << 'EOF' > capacitor.config.json
          {
            "appId": "com.stridecircuit.paceplot",
            "appName": "Pace Plot",
            "webDir": "www"
          }
          EOF
          
          rm -rf android
          npx cap add android
          npx cap sync android

      - name: Configure Gradle Timeouts and Fix Kotlin Duplicates
        run: |
          sed -i 's/versionCode 1/versionCode 2/g' android/app/build.gradle
          sed -i 's/versionName "1.0"/versionName "2.0.0"/g' android/app/build.gradle

          cat << 'PROPS' >> android/gradle.properties
          systemProp.org.gradle.internal.http.connectionTimeout=180000
          systemProp.org.gradle.internal.http.socketTimeout=180000
          org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m
          PROPS

          cat << 'EOF' >> android/app/build.gradle

          configurations.all {
              resolutionStrategy {
                  force 'org.jetbrains.kotlin:kotlin-stdlib:1.8.22'
                  force 'org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.8.22'
                  force 'org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.8.22'
              }
          }
          EOF

      - name: Build Android App Bundle (.aab) with Auto-Retry
        run: |
          cd android
          chmod +x gradlew
          ./gradlew bundleRelease -x lint -x lintVitalRelease --no-daemon || \
          (sleep 5 && ./gradlew bundleRelease -x lint -x lintVitalRelease --no-daemon)

      - name: Sign App Bundle with Permanent Stride Circuit Key
        run: |
          # Reconstruct permanent keystore matching upload_certificate.pem
          echo "" | base64 -d > release-key.jks
          AAB_FILE=$(find android/app/build/outputs/bundle/release -name "*.aab" | head -n 1)
          jarsigner -verbose -sigalg SHA256withRSA -digestalg SHA-256 -keystore release-key.jks -storepass StrideCircuit2026 -keypass StrideCircuit2026 "$AAB_FILE" paceplot
          cp "$AAB_FILE" paceplot-v2-signed.aab

      - name: Upload Finished Bundle Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PacePlot-v2-AAB
          path: paceplot-v2-signed.aab
